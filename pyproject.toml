[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slicklab-beacon"
version = "0.1.0"
description = "Builds a business's online presence and AI-answer visibility, with human approval at every step."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11",
  "click>=8.1",
  "httpx>=0.27",
  "itsdangerous>=2.1",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "starlette>=0.37",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
beacon = "beacon.cli:main"

[tool.setuptools.packages.find]
include = ["beacon*"]

[tool.setuptools.package-data]
beacon = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
