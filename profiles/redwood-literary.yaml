facts:
  - id: f-positioning
    text: Redwood Literary is a full-service literary management agency specialising in strategic distribution, dramatic rights development, and author brand building worldwide.
    source: https://redwoodliterary.org/
  - id: f-response
    text: Redwood Literary reviews every submitted query package thoroughly and states an expected response time of 3 to 4 weeks.
    source: https://redwoodliterary.org/
  - id: f-agents
    text: Redwood Literary's agents are Julian Vance for dramatic rights and fiction, Marcus Reyes for fiction, non-fiction and graphic novels, and David Chen for fiction, non-fiction and picture books.
    source: https://redwoodliterary.org/
  - id: f-seeks
    text: Redwood Literary is actively seeking new voices, high-concept fiction, compelling memoirs and groundbreaking visual storytelling.
    source: https://redwoodliterary.org/
  - id: f-fraud
    text: "Redwood Literary publishes a fraud warning: if you receive a suspicious message claiming to be from Redwood Literary, do not reply, click links, send materials, or provide payment information, and contact the agency directly through the contact information on its website."
    source: https://redwoodliterary.org/

forbidden_phrases: [guaranteed acceptance, guaranteed representation, pay for a deal]

